    # qid transitively via tsp-ltv 0.6.0 (qid-saml SAML long-term validation)
    # and dev-only krb5 1.0.0 (qid-federation SPNEGO proof). Time-bounded
    # waiver tracked in deny.toml; replacement via a tsp-ltv/krb5 release
    # without chrono or migration to jiff/time. Review by 2027-02-18. Kept in
    # sync with deny.toml. No vulnerability advisory is waived here.
    "RUSTSEC-2026-0543",
]
