name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.96"

jobs:
  build-test:
    name: Build/Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
          - name: linux-aarch64
            os: ubuntu-24.04-arm
          - name: windows-x86_64
            os: windows-2022
          - name: macos-aarch64
            os: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Build workspace
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo build --workspace --all-targets --locked
      - name: Test workspace
        shell: bash
        env:
          RUSTFLAGS: "-D warnings"
        run: |
          set +e
          trap 'rm -f "$RUNNER_TEMP/workspace-tests.log"' EXIT
          # Keep Windows serial while SQLite cleanup failures remain under investigation.
          test_args=()
          case "${RUNNER_OS:-}" in
            Linux|macOS) ;;
            *) test_args=(-- --test-threads=1) ;;
          esac
          cargo test --workspace --locked "${test_args[@]}" 2>&1 | tee "$RUNNER_TEMP/workspace-tests.log"
          status=("${PIPESTATUS[@]}")
          if command -v python3 >/dev/null 2>&1; then
            python3 scripts/report-test-binary-timings.py --input "$RUNNER_TEMP/workspace-tests.log" --output "$RUNNER_TEMP/test-binary-timings.csv"
          else
            python scripts/report-test-binary-timings.py --input "$RUNNER_TEMP/workspace-tests.log" --output "$RUNNER_TEMP/test-binary-timings.csv"
          fi
          report_status=$?
          if [[ ${status[0]} -ne 0 ]]; then exit "${status[0]}"; fi
          if [[ ${status[1]} -ne 0 ]]; then exit "${status[1]}"; fi
          exit "$report_status"
      - name: Upload test binary timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-binary-timings-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/test-binary-timings.csv
          if-no-files-found: error

  postgres-push:
    name: PostgreSQL Push Storage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          # Public, disposable CI database credentials; never repository secrets.
          POSTGRES_USER: qid_test
          POSTGRES_PASSWORD: qid_test
          POSTGRES_DB: qid_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qid_test -d qid_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Test PostgreSQL push storage
        env:
          QID_TEST_POSTGRES_URL: postgres://qid_test:qid_test@localhost:5432/qid_test
          RUSTFLAGS: "-D warnings"
        run: |
          cargo test -p qid-storage --test postgres_push --test postgres_admin_elevation -p qid-oauth --test postgres_grants --locked -- --nocapture

  all-features:
    name: All Features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Test all features
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo test --workspace --all-targets --all-features --locked
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install the pinned independent EST client
        run: python3 -m pip install -r qid-resource/tests/workload/requirements-est.txt
      - name: Verify workload EST with an independent client
        run: cargo test -p qid-resource --locked --test workload est::independent_python_est_client -- --ignored --exact --nocapture
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify RFC 6961 multi-staple with Bouncy Castle
        shell: bash
        env:
          BC_VERSION: "1.84"
          RUSTFLAGS: "-D warnings"
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/qid-bctls"
          mkdir -p "$dir/classes"
          base="https://repo1.maven.org/maven2/org/bouncycastle"
          for artifact in bcprov-jdk18on bcutil-jdk18on bctls-jdk18on; do
            curl -fsSL "$base/$artifact/$BC_VERSION/$artifact-$BC_VERSION.jar" \
              -o "$dir/$artifact.jar"
          done
          cp="$dir/bcprov-jdk18on.jar:$dir/bcutil-jdk18on.jar:$dir/bctls-jdk18on.jar"
          javac -cp "$cp" -d "$dir/classes" ci/bctls/V2Client.java
          QID_BCTLS_JARS="$cp" QID_BCTLS_CLASSES="$dir/classes" \
            cargo test -p qid-tls --locked --test bctls_v2_interop -- --ignored --exact --nocapture
      - name: Test the qid TLS backend skeleton
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo test -p qidd --no-default-features --features tls-qid --locked --all-targets

  config-samples:
    name: Config Samples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Validate sample configs
        env:
          RUSTFLAGS: "-D warnings"
        run: bash ./scripts/check-config-samples.sh

  qpx-e2e-smoke:
    name: Sister PEP Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Checkout pinned qpx
        uses: actions/checkout@v7
        with:
          repository: t-koba/qpx
          ref: 7c68ccbb49558b9ed955818677b6e44dc2465c4e
          path: qpx
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Build qpxd with native TLS
        working-directory: qpx
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo build --locked -p qpxd --no-default-features --features tls-native
      - name: Run qid/qpx smoke
        env:
          QPXD_BIN: ${{ github.workspace }}/qpx/target/debug/qpxd
          RUSTFLAGS: "-D warnings"
        run: bash ./examples/qpx-e2e/run.sh

  fuzz-smoke:
    name: Fuzz Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # Pinned: the nightly after 2026-10-31 regressed on sqlx-core 0.8.6
          # (rust-lang/rust#165263); nightly-2026-10-31 compiles it.
          toolchain: nightly-2026-10-31
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Check the fuzz lock matches the manifest
        # cargo-fuzz has no lock-enforcing flag, so a stale lock would be
        # rewritten silently instead of failing.
        working-directory: fuzz
        run: cargo fetch --locked
      - name: Run JWT fuzz smoke
        working-directory: fuzz
        run: cargo fuzz run jwt -- -max_total_time=30
      - name: Run SAML XML fuzz smoke
        working-directory: fuzz
        run: cargo fuzz run saml_xml -- -max_total_time=30
      - name: Run SCIM filter fuzz smoke
        working-directory: fuzz
        # The value profile gives libFuzzer feedback on the equality checks
        # the filter parser makes.
        run: cargo fuzz run scim_filter -- -max_total_time=30 -use_value_profile=1
      - name: Run policy fuzz smoke
        working-directory: fuzz
        run: cargo fuzz run policy -- -max_total_time=30
      - name: Run RADIUS fuzz smoke
        working-directory: fuzz
        run: cargo fuzz run radius -- -max_total_time=30
      - name: Run TACACS+ fuzz smoke
        working-directory: fuzz
        run: cargo fuzz run tacacs -- -max_total_time=30
      - name: Run EAP fuzz smoke
        working-directory: fuzz
        run: cargo fuzz run eap -- -max_total_time=30
      - name: Run qid-tls record fuzz smoke
        working-directory: fuzz
        run: cargo fuzz run tls13_record -- -max_total_time=30
      - name: Run qid-tls ClientHello fuzz smoke
        working-directory: fuzz
        run: cargo fuzz run tls12_client_hello -- -max_total_time=30
      - name: Run qid-tls TLS 1.2 record fuzz smoke
        working-directory: fuzz
        run: cargo fuzz run tls12_record_protection -- -max_total_time=30

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: llvm-tools-preview
      - name: Test coverage gate
        run: bash ./scripts/test-coverage.sh
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov
      - name: Check coverage
        run: bash ./scripts/coverage.sh
