name: Windows SQLite Cleanup Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      QID_DIAGNOSTIC_OWNED: "false"
      QID_SQLITE_CLEANUP_SUFFIX: trace-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.96"
      - name: Capture one exact-path cleanup trace
        timeout-minutes: 24
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $dir = Join-Path $env:RUNNER_TEMP "qid-sqlite-$env:QID_SQLITE_CLEANUP_SUFFIX"
          $db = Join-Path ([IO.Path]::GetTempPath()) "qid-user-deletion-$env:QID_SQLITE_CLEANUP_SUFFIX.db"
          $tool = Join-Path $dir 'Procmon64.exe'
          $pml = Join-Path $dir 'trace.pml'
          $csv = Join-Path $dir 'trace.csv'
          $config = Join-Path $dir 'trace.pmc'
          $stage = 'preflight'
          $started = $false
          $stopped = $false
          $failed = $false
          $testExit = $null
          $proc = $null
          $session = [Diagnostics.Process]::GetCurrentProcess().SessionId

          function Owned-Processes {
            # The launcher can hand off to another PID. Match the verified image
            # in this session, not a process name or the Start-Process result.
            return @(Get-CimInstance Win32_Process -Filter "Name = 'Procmon64.exe' AND SessionId = $session" |
              Where-Object {
                if (!$_.ExecutablePath) { throw 'Cannot establish Procmon ownership' }
                [string]::Equals($_.ExecutablePath, $tool, [StringComparison]::OrdinalIgnoreCase)
              })
          }

          function Run-Procmon([string]$arguments) {
            $p = Start-Process $tool -ArgumentList $arguments -PassThru
            if (!$p.WaitForExit(15000)) { throw 'Procmon command timed out' }
            if ($p.ExitCode -ne 0) { throw 'Procmon command failed' }
          }
          function Wait-Ready([scriptblock]$condition) {
            $deadline = [DateTime]::UtcNow.AddSeconds(15)
            $signal = [Threading.ManualResetEvent]::new($false)
            try {
              do {
                if (& $condition) { return }
                # Bounded condition polling, not a fixed startup delay.
                [void]$signal.WaitOne(100)
              } while ([DateTime]::UtcNow -lt $deadline)
              throw 'Procmon UI readiness timed out'
            } finally { $signal.Dispose() }
          }
          try {
            if (Test-Path $dir) { throw 'Diagnostic directory already exists' }
            foreach ($path in @($db, "$db-wal", "$db-shm", "$db-journal")) {
              if (Test-Path -LiteralPath $path) { throw 'Test database or sidecar already exists' }
            }
            [void](New-Item -ItemType Directory $dir)
            'QID_DIAGNOSTIC_OWNED=true' >> $env:GITHUB_ENV
            $stage = 'download and signature verification'
            Invoke-WebRequest 'https://download.sysinternals.com/files/ProcessMonitor.zip' -OutFile "$dir/tool.zip"
            Expand-Archive "$dir/tool.zip" $dir
            $signature = Get-AuthenticodeSignature $tool
            if ($signature.Status -ne 'Valid' -or
                $signature.SignerCertificate.Subject -notmatch '(^|,\s*)O=Microsoft Corporation(,|$)') {
              throw 'Procmon Microsoft signature validation failed'
            }

            # Let the signed application write its own PMC format. /NoConnect is
            # essential: no events may be captured while configuring the filter.
            $stage = 'noncapturing UI initialization'
            Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes
            $scope = [Windows.Automation.TreeScope]::Descendants
            $ae = [Windows.Automation.AutomationElement]
            $ct = [Windows.Automation.ControlType]
            if (@(Owned-Processes).Count -ne 0) { throw 'Procmon image already running' }
            $started = $true
            Start-Process $tool -ArgumentList "/AcceptEula /Quiet /NoConnect /BackingFile `"$pml`"" | Out-Null
            Wait-Ready {
              $owners = @(Owned-Processes)
              if ($owners.Count -gt 1) { throw 'Ambiguous Procmon owner' }
              if ($owners.Count -eq 0) { return $false }
              $script:pidCondition = [Windows.Automation.PropertyCondition]::new(
                $ae::ProcessIdProperty, [int]$owners[0].ProcessId)
              $windows = @($ae::RootElement.FindAll([Windows.Automation.TreeScope]::Children,
                [Windows.Automation.AndCondition]::new($pidCondition,
                  [Windows.Automation.PropertyCondition]::new($ae::ControlTypeProperty, $ct::Window))))
              if ($windows.Count -gt 1) { throw 'Ambiguous Procmon window' }
              if ($windows.Count -eq 0) { return $false }
              if (!$windows[0].Current.NativeWindowHandle -or !$windows[0].Current.IsEnabled) { return $false }
              $menus = @($windows[0].FindAll($scope,
                [Windows.Automation.PropertyCondition]::new($ae::ControlTypeProperty, $ct::MenuItem)) |
                Where-Object { $_.Current.Name -eq 'File' })
              if ($menus.Count -ne 1) { return $false }
              $script:proc = [Diagnostics.Process]::GetProcessById([int]$owners[0].ProcessId)
              return $true
            }
            function Elements($type) {
              $condition = [Windows.Automation.AndCondition]::new(
                $pidCondition, [Windows.Automation.PropertyCondition]::new($ae::ControlTypeProperty, $type))
              return $ae::RootElement.FindAll($scope, $condition)
            }
            function Find-Control($type, [string]$name) {
              $matches = @(Elements $type | Where-Object { $_.Current.Name -match $name })
              if ($matches.Count -ne 1) { throw 'Unexpected Procmon UI layout' }
              return $matches[0]
            }
            function Click($element) {
              $element.GetCurrentPattern([Windows.Automation.InvokePattern]::Pattern).Invoke()
            }
            function Set-Menu([string]$name, [bool]$open) {
              $pattern = (Find-Control $ct::MenuItem $name).GetCurrentPattern(
                [Windows.Automation.ExpandCollapsePattern]::Pattern)
              if ($open) { $pattern.Expand() } else { $pattern.Collapse() }
            }
            function Menu([string]$parent, [string]$item) {
              Set-Menu $parent $true
              Click (Find-Control $ct::MenuItem $item)
            }
            function Checked($element) {
              $legacy = $element.GetCurrentPattern([Windows.Automation.LegacyIAccessiblePattern]::Pattern)
              return ($legacy.Current.State -band 0x10) -ne 0
            }
            Wait-Ready { @(Elements $ct::MenuItem | Where-Object { $_.Current.Name -eq 'File' }).Count -eq 1 }
            Set-Menu '^File$' $true
            $capture = Find-Control $ct::MenuItem '^Capture Events'
            if (Checked $capture) { throw 'Unexpected active capture before filtering' }
            Set-Menu '^File$' $false
            $stage = 'exact path filter configuration'
            Menu '^Filter$' '^Filter\.\.\.'
            Wait-Ready { @(Elements $ct::Window | Where-Object { $_.Current.Name -eq 'Process Monitor Filter' }).Count -eq 1 }
            $dialog = Find-Control $ct::Window '^Process Monitor Filter$'
            $combos = @($dialog.FindAll($scope,
              [Windows.Automation.PropertyCondition]::new($ae::ControlTypeProperty, $ct::ComboBox)))
            if ($combos.Count -ne 4) { throw 'Unexpected Procmon filter controls' }
            # Remove every existing rule, including defaults, rather than relying
            # on the runner's saved configuration. Never capture during this step.
            $list = $dialog.FindFirst($scope,
              [Windows.Automation.PropertyCondition]::new($ae::ClassNameProperty, 'SysListView32'))
            if ($null -eq $list) { throw 'Procmon filter list unavailable' }
            function Rules {
              return @($list.FindAll([Windows.Automation.TreeScope]::Children,
                [Windows.Automation.OrCondition]::new(
                  [Windows.Automation.PropertyCondition]::new($ae::ControlTypeProperty, $ct::DataItem),
                  [Windows.Automation.PropertyCondition]::new($ae::ControlTypeProperty, $ct::ListItem))))
            }
            $rules = @(Rules)
            if ($rules.Count -eq 0) { throw 'Cannot inspect existing filter rules' }
            $initialCount = $rules.Count
            for ($i = 0; $i -lt $initialCount; $i++) {
              $rules[0].GetCurrentPattern([Windows.Automation.SelectionItemPattern]::Pattern).Select()
              Click (Find-Control $ct::Button '^Remove$')
              $remaining = @(Rules)
              if ($remaining.Count -ne $rules.Count - 1) { throw 'Filter removal failed' }
              $rules = $remaining
            }
            function Select-Value($combo, [string]$value) {
              $combo.GetCurrentPattern([Windows.Automation.ExpandCollapsePattern]::Pattern).Expand()
              $items = @($combo.FindAll($scope,
                [Windows.Automation.PropertyCondition]::new($ae::ControlTypeProperty, $ct::ListItem)) |
                Where-Object { $_.Current.Name -eq $value })
              if ($items.Count -ne 1) { throw 'Required filter choice unavailable' }
              $items[0].GetCurrentPattern([Windows.Automation.SelectionItemPattern]::Pattern).Select()
            }
            Select-Value $combos[0] 'Path'
            Select-Value $combos[1] 'begins with'
            $edit = $combos[2].FindFirst($scope,
              [Windows.Automation.PropertyCondition]::new($ae::ControlTypeProperty, $ct::Edit))
            $edit.GetCurrentPattern([Windows.Automation.ValuePattern]::Pattern).SetValue($db)
            Select-Value $combos[3] 'Include'
            Click (Find-Control $ct::Button '^Add$')
            function Assert-ExactRule {
              $rules = @(Rules)
              if ($rules.Count -ne 1) { throw 'Expected exactly one path rule' }
              $labels = @($rules[0].Current.Name) + @($rules[0].FindAll($scope,
                [Windows.Automation.Condition]::TrueCondition) | ForEach-Object { $_.Current.Name })
              foreach ($expected in @('Path', 'begins with', $db, 'Include')) {
                if ($labels -notcontains $expected) { throw 'Could not verify the exact path rule' }
              }
            }
            Assert-ExactRule
            Click (Find-Control $ct::Button '^OK$')
            Set-Menu '^Filter$' $true
            $drop = Find-Control $ct::MenuItem '^Drop Filtered Events$'
            if (!(Checked $drop)) {
              Click $drop
              Set-Menu '^Filter$' $true
            }
            if (!(Checked (Find-Control $ct::MenuItem '^Drop Filtered Events$'))) {
              throw 'Destructive filtering is not enabled'
            }
            Set-Menu '^Filter$' $false
            $stage = 'configuration export'
            Menu '^File$' '^Export Configuration'
            Wait-Ready { @(Elements $ct::Edit | Where-Object { $_.Current.Name -eq 'File name:' }).Count -eq 1 }
            (Find-Control $ct::Edit '^File name:$').GetCurrentPattern(
              [Windows.Automation.ValuePattern]::Pattern).SetValue($config)
            Click (Find-Control $ct::Button '^Save$')
            Wait-Ready { Test-Path $config }
            $stage = 'capture readiness'
            # Re-read the live rule and destructive-filter state after export.
            # No toggle is allowed unless capture is still unchecked.
            Menu '^Filter$' '^Filter\.\.\.'
            Wait-Ready { @(Elements $ct::Window | Where-Object { $_.Current.Name -eq 'Process Monitor Filter' }).Count -eq 1 }
            $dialog = Find-Control $ct::Window '^Process Monitor Filter$'
            $list = $dialog.FindFirst($scope,
              [Windows.Automation.PropertyCondition]::new($ae::ClassNameProperty, 'SysListView32'))
            if ($null -eq $list) { throw 'Procmon filter list unavailable' }
            Assert-ExactRule
            Click (Find-Control $ct::Button '^OK$')
            Set-Menu '^Filter$' $true
            if (!(Checked (Find-Control $ct::MenuItem '^Drop Filtered Events$'))) {
              throw 'Destructive filtering is not enabled'
            }
            Set-Menu '^Filter$' $false
            Set-Menu '^File$' $true
            $capture = Find-Control $ct::MenuItem '^Capture Events'
            if (Checked $capture) { throw 'Unexpected active capture before toggle' }
            Click $capture
            Set-Menu '^File$' $true
            if (!(Checked (Find-Control $ct::MenuItem '^Capture Events'))) { throw 'Capture did not start' }
            Set-Menu '^File$' $false
            Run-Procmon '/WaitForIdle'
            $stage = 'focused test'
            & cargo test --locked -p qid-storage --test user_deletion sql_user_deletion_cleans_only_owned_authentication_state -- --exact --nocapture
            $testExit = $LASTEXITCODE
          } catch {
            # Do not print UI, download, or trace exceptions containing host paths.
            Write-Host "Diagnostic failed during $stage (HRESULT $($_.Exception.HResult))."
            $failed = $true
          } finally {
            if ($started) {
              try {
                if ($null -ne $proc -and !$proc.HasExited) {
                  if (@(Owned-Processes).Count -eq 0) { throw 'Owned process disappeared from its verified image' }
                  Run-Procmon '/Terminate'
                  if (!$proc.WaitForExit(15000)) { throw 'Owned process did not exit' }
                }
                Wait-Ready { @(Owned-Processes).Count -eq 0 }
                $stopped = $null -ne $proc -and $proc.HasExited
              } catch {
                Write-Host "Diagnostic failed during capture shutdown (HRESULT $($_.Exception.HResult))."
                $failed = $true
              }
            }
          }
          if ($null -ne $testExit -and $stopped) {
            try {
              Run-Procmon "/AcceptEula /Quiet /OpenLog `"$pml`" /SaveApplyFilter /SaveAs `"$csv`""
              $count = 0
              Import-Csv $csv | ForEach-Object {
                $row = $_
                # Check again at output, even though capture used a destructive filter.
                if ($row.Path.StartsWith($db, [StringComparison]::OrdinalIgnoreCase)) {
                  $suffix = $row.Path.Substring($db.Length)
                  if ($suffix -notmatch '^(-wal|-shm|-journal)?$') { throw 'Unexpected matching path suffix' }
                  $process = [IO.Path]::GetFileName($row.'Process Name')
                  if ($process -notmatch '^[A-Za-z0-9_.-]+$' -or $row.PID -notmatch '^\d+$' -or
                      $row.'Time of Day' -notmatch '^[0-9/:. APMapm-]+$' -or
                      $row.Operation -notmatch '^[A-Za-z0-9_ ]+$' -or
                      $row.Result -notmatch '^[A-Za-z0-9_ ]+$') { throw 'Unexpected event field' }
                  # Never print full Detail: it can contain paths and arguments.
                  $safe = [regex]::Matches($row.Detail, '(?:^|, )(ShareMode|Desired Access): ([^:]*?)(?=, [^,:]+: |$)') |
                    ForEach-Object {
                      $key = $_.Groups[1].Value
                      $value = $_.Groups[2].Value
                      $flags = if ($key -eq 'ShareMode') { 'None|Read|Write|Delete' } else {
                        'Generic Read|Generic Write|Generic Execute|Generic All|Read Data/List Directory|Write Data/Add File|Append Data/Add Subdirectory|Read EA|Write EA|Execute/Traverse|Delete Child|Read Attributes|Write Attributes|Delete|Read Control|Write DAC|Write Owner|Synchronize|Access System Security|Maximum Allowed'
                      }
                      if ($value -match "^(?:$flags)(?:, (?:$flags))*`$") { "$key`: $value" }
                    }
                  Write-Host "$($row.'Time of Day') $process $($row.PID) $($row.Operation) $($row.Result) <test-db>$suffix $($safe -join '; ')"
                  $count++
                }
              }
              if ($count -eq 0) { throw 'No matching trace events were exported' }
            } catch {
              Write-Host 'ERROR: Trace export or sanitization failed (raw exception suppressed).'
              $failed = $true
            }
          }
          if ($failed -or $null -eq $testExit -or $testExit -ne 0) { exit 1 }
      - name: Stop capture and erase all diagnostic files
        timeout-minutes: 2
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:QID_DIAGNOSTIC_OWNED -ne 'true') { exit 0 }
          $dir = Join-Path $env:RUNNER_TEMP "qid-sqlite-$env:QID_SQLITE_CLEANUP_SUFFIX"
          $db = Join-Path ([IO.Path]::GetTempPath()) "qid-user-deletion-$env:QID_SQLITE_CLEANUP_SUFFIX.db"
          $tool = Join-Path $dir 'Procmon64.exe'
          $failed = $false
          $session = [Diagnostics.Process]::GetCurrentProcess().SessionId
          function Owned-Processes {
            return @(Get-CimInstance Win32_Process -Filter "Name = 'Procmon64.exe' AND SessionId = $session" |
              Where-Object {
                if (!$_.ExecutablePath) { throw 'Cannot establish Procmon ownership' }
                [string]::Equals($_.ExecutablePath, $tool, [StringComparison]::OrdinalIgnoreCase)
              })
          }
          if (Test-Path $tool) {
            try {
              $signature = Get-AuthenticodeSignature $tool
              if ($signature.Status -ne 'Valid' -or
                  $signature.SignerCertificate.Subject -notmatch '(^|,\s*)O=Microsoft Corporation(,|$)') {
                throw 'Untrusted cleanup executable'
              }
              $owned = @(Owned-Processes | ForEach-Object { [Diagnostics.Process]::GetProcessById([int]$_.ProcessId) })
              if ($owned.Count -gt 0) {
                $p = Start-Process $tool -ArgumentList '/AcceptEula /Quiet /Terminate' -PassThru
                if (!$p.WaitForExit(15000) -or $p.ExitCode -ne 0) { throw 'Procmon cleanup stop failed' }
                $deadline = [DateTime]::UtcNow.AddSeconds(15)
                $signal = [Threading.ManualResetEvent]::new($false)
                try {
                  do {
                    $remaining = @(Owned-Processes)
                    if ($remaining.Count -eq 0 -and @($owned | Where-Object { !$_.HasExited }).Count -eq 0) { break }
                    [void]$signal.WaitOne(100)
                  } while ([DateTime]::UtcNow -lt $deadline)
                  if ($remaining.Count -ne 0 -or @($owned | Where-Object { !$_.HasExited }).Count -ne 0) {
                    throw 'Owned Procmon process did not exit'
                  }
                } finally { $signal.Dispose() }
              }
            } catch {
              Write-Host "Diagnostic failed during final shutdown (HRESULT $($_.Exception.HResult))."
              $failed = $true
            }
          }
          # Each removal is independent: a locked DB must not skip trace erasure.
          $paths = @($db, "$db-wal", "$db-shm", "$db-journal")
          if (Test-Path -LiteralPath $dir) {
            try {
              $paths += @(Get-ChildItem -LiteralPath $dir -File -Recurse | ForEach-Object FullName)
            } catch {
              Write-Host 'ERROR: Could not enumerate all diagnostic files for erasure.'
              $failed = $true
            }
            $paths += $dir
          }
          foreach ($path in $paths) {
            try {
              if (Test-Path -LiteralPath $path) { Remove-Item -LiteralPath $path -Recurse -Force }
            } catch {
              Write-Host 'ERROR: Diagnostic cleanup could not remove a temporary file.'
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
