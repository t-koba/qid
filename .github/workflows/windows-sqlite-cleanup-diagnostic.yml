name: Windows SQLite Cleanup Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      QID_DIAGNOSTIC_OWNED: "false"
      QID_SQLITE_CLEANUP_SUFFIX: trace-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.96"
      - name: Preflight the headless helper without capturing diagnostic output
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $owned = [Collections.Generic.List[string]]::new()
          $child = [Diagnostics.Process]::new()
          $started = $false
          $failed = $false
          try {
            $db = Join-Path ([IO.Path]::GetTempPath()) "qid-cleanup-preflight-$([Guid]::NewGuid().ToString('N')).db"
            foreach ($path in @($db, "$db-wal", "$db-shm", "$db-journal")) {
              # CreateNew never takes ownership of a pre-existing file.
              $file = [IO.File]::Open($path, [IO.FileMode]::CreateNew)
              try { $owned.Add($path) } finally { $file.Dispose() }
            }
            $child.StartInfo.FileName = (Get-Process -Id $PID).Path
            $child.StartInfo.UseShellExecute = $false
            $child.StartInfo.CreateNoWindow = $true
            $child.StartInfo.RedirectStandardOutput = $true
            $child.StartInfo.RedirectStandardError = $true
            foreach ($argument in @('-NoLogo', '-NoProfile', '-NonInteractive', '-File',
                (Join-Path $env:GITHUB_WORKSPACE 'qid-storage/tests/fixtures/windows_sqlite_cleanup.ps1'),
                '-Database', $db, '-Preflight')) {
              $child.StartInfo.ArgumentList.Add($argument)
            }
            $started = $child.Start()
            if (-not $started) { throw 'Helper did not start' }
            # Drain both streams without handlers: no helper or exception text escapes.
            $child.BeginOutputReadLine()
            $child.BeginErrorReadLine()
            if (-not $child.WaitForExit(15000)) { throw 'Helper timed out' }
            if ($child.ExitCode -ne 0) { throw 'Helper failed' }
          } catch {
            Write-Host 'ERROR: Headless helper preflight failed (raw output suppressed).'
            $failed = $true
          } finally {
            try {
              if ($started -and -not $child.HasExited) {
                $child.Kill($true)
                if (-not $child.WaitForExit(15000)) { throw 'Helper did not stop' }
              }
            } catch {
              Write-Host 'ERROR: Preflight cleanup could not stop the helper (raw output suppressed).'
              $failed = $true
            } finally {
              $child.Dispose()
            }
            # Independent removals include only files this step successfully created.
            foreach ($path in $owned) {
              try {
                if (Test-Path -LiteralPath $path) { Remove-Item -LiteralPath $path -Force }
              } catch {
                Write-Host 'ERROR: Preflight cleanup could not remove a temporary file.'
                $failed = $true
              }
            }
          }
          if ($failed) { exit 1 }
          Write-Host 'Headless helper preflight passed (no diagnostic output retained).'
      - name: Query exact-path owners immediately before the first deletion
        timeout-minutes: 24
        shell: pwsh
        env:
          QID_SQLITE_CLEANUP_DIAGNOSTIC: "1"
          QID_SQLITE_CLEANUP_DIAGNOSTIC_TIMEOUT_SECONDS: "15"
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $db = Join-Path ([IO.Path]::GetTempPath()) "qid-user-deletion-$env:QID_SQLITE_CLEANUP_SUFFIX.db"
          try {
            foreach ($path in @($db, "$db-wal", "$db-shm", "$db-journal")) {
              if (Test-Path -LiteralPath $path) { throw 'Test database or sidecar already exists' }
            }
            'QID_DIAGNOSTIC_OWNED=true' >> $env:GITHUB_ENV
          } catch {
            Write-Host 'ERROR: Diagnostic path preflight failed (raw exception suppressed).'
            exit 1
          }
          # The opt-in test invokes the headless Restart Manager helper after
          # repo.close(), before the unchanged first remove_file assertion.
          # This is an owner snapshot, not an exhaustive file-I/O/handle trace;
          # an empty result does not prove that no kernel/external lock exists.
          & cargo test --locked -p qid-storage --test user_deletion sql_user_deletion_cleans_only_owned_authentication_state -- --exact --nocapture
          exit $LASTEXITCODE
      - name: Erase the exact diagnostic database and sidecars
        timeout-minutes: 2
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:QID_DIAGNOSTIC_OWNED -ne 'true') { exit 0 }
          $db = Join-Path ([IO.Path]::GetTempPath()) "qid-user-deletion-$env:QID_SQLITE_CLEANUP_SUFFIX.db"
          $failed = $false
          # Independent removals: a locked DB must not skip sidecar cleanup.
          # There are no downloads, raw traces, exports or helper output files.
          foreach ($path in @($db, "$db-wal", "$db-shm", "$db-journal")) {
            try {
              if (Test-Path -LiteralPath $path) { Remove-Item -LiteralPath $path -Force }
            } catch {
              Write-Host 'ERROR: Diagnostic cleanup could not remove a temporary file.'
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
