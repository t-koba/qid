name: Windows SQLite Cleanup Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: never
      QID_DIAGNOSTIC_OWNED: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Verify the exact dispatched source
        shell: pwsh
        env:
          QID_EXPECTED_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:QID_EXPECTED_SHA -cnotmatch '^(?:[0-9a-f]{40}|[0-9a-f]{64})$') {
            Write-Host 'ERROR: Expected source must be a full commit ID.'
            exit 1
          }
          $actual = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -cne $env:QID_EXPECTED_SHA) {
            Write-Host 'ERROR: Checked-out source does not match the requested commit.'
            exit 1
          }
          Write-Host "Verified diagnostic source $actual."
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.96"
      - name: Acquire optional Microsoft Handle
        timeout-minutes: 1
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $stage = 'startup'
          try {
            $stage = 'elevation'
            $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
            try {
              $principal = [Security.Principal.WindowsPrincipal]::new($identity)
              if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
                throw 'Not elevated'
              }
            } finally { $identity.Dispose() }
            $stage = 'prepare'
            $key = [Guid]::NewGuid().ToString('N')
            $directory = Join-Path $env:RUNNER_TEMP "qid-handle-$key"
            if (Test-Path -LiteralPath $directory) { throw 'Path collision' }
            $null = New-Item -ItemType Directory -Path $directory
            "QID_SQLITE_HANDLE_KEY=$key" >> $env:GITHUB_ENV
            $stage = 'download'
            $archive = Join-Path $directory 'Handle.zip'
            Invoke-WebRequest -Uri 'https://download.sysinternals.com/files/Handle.zip' -OutFile $archive -TimeoutSec 30
            $stage = 'archive'
            if ((Get-Item -LiteralPath $archive).Length -gt 5MB) { throw 'Archive too large' }
            Expand-Archive -LiteralPath $archive -DestinationPath $directory
            $stage = 'signature'
            $executable = Join-Path $directory 'handle64.exe'
            $signature = Get-AuthenticodeSignature -LiteralPath $executable
            $subject = $signature.SignerCertificate.Subject
            if ($signature.Status -ne 'Valid' -or
                $subject -notmatch '(?:^|,\s*)CN=Microsoft Corporation(?:,|$)' -or
                $subject -notmatch '(?:^|,\s*)O=Microsoft Corporation(?:,|$)') {
              throw 'Signature rejected'
            }
            $stage = 'self-test'
            # Positive self-test: keep one exact-path file handle open in this
            # process and require Handle to find it under this PID before use.
            $probe = Join-Path $directory 'handle-self-test.db'
            $stream = $null
            $child = [Diagnostics.Process]::new()
            $started = $false
            try {
              $stream = [IO.File]::Open($probe, [IO.FileMode]::CreateNew,
                [IO.FileAccess]::ReadWrite, [IO.FileShare]::ReadWrite)
              $child.StartInfo.FileName = $executable
              $child.StartInfo.UseShellExecute = $false
              $child.StartInfo.CreateNoWindow = $true
              $child.StartInfo.RedirectStandardOutput = $true
              $child.StartInfo.RedirectStandardError = $true
              foreach ($argument in @('-accepteula', '-v', '-p', [string]$PID, $probe)) {
                $child.StartInfo.ArgumentList.Add($argument)
              }
              $started = $child.Start()
              if (-not $started) { throw 'Handle self-test did not start' }
              $stdout = $child.StandardOutput.ReadToEndAsync()
              $stderr = $child.StandardError.ReadToEndAsync()
              if (-not $child.WaitForExit(3000)) {
                $child.Kill($true)
                if (-not $child.WaitForExit(1000)) { throw 'Handle self-test did not stop' }
                throw 'Handle self-test timed out'
              }
              if (-not [Threading.Tasks.Task]::WaitAll(
                  [Threading.Tasks.Task[]]@($stdout, $stderr), 1000)) { throw 'Handle output timed out' }
              $text = $stdout.Result
              $lines = $text -split '\r?\n'
              $headerIndex = -1
              for ($i = 0; $i -lt $lines.Length; $i++) {
                if ($lines[$i].Replace('"', '') -ceq
                    'Process,PID,User,Handle,Type,Share Flags,Name,Access') {
                  $headerIndex = $i
                  break
                }
              }
              if ($text.Length -gt 65536 -or $stderr.Result.Length -ne 0 -or
                  $child.ExitCode -ne 0 -or $headerIndex -lt 0) {
                throw 'Handle output untrusted'
              }
              $csv = $lines[$headerIndex..($lines.Length - 1)] -join "`n"
              $matches = @($csv | ConvertFrom-Csv | Where-Object {
                $_.PID -ceq [string]$PID -and $_.Type -ceq 'File' -and
                [string]::Equals($_.Name, $probe, [StringComparison]::OrdinalIgnoreCase)
              })
              if ($matches.Count -lt 1) { throw 'Handle exact-path self-test failed' }
            } finally {
              try {
                if ($started -and -not $child.HasExited) {
                  $child.Kill($true)
                  if (-not $child.WaitForExit(1000)) { throw 'Handle self-test did not stop' }
                }
              } finally {
                $child.Dispose()
                if ($null -ne $stream) { $stream.Dispose() }
                if (Test-Path -LiteralPath $probe) { Remove-Item -LiteralPath $probe -Force }
              }
            }
            $stage = 'version'
            $version = [Diagnostics.FileVersionInfo]::GetVersionInfo($executable).FileVersion
            if ([string]::IsNullOrEmpty($version) -or $version -cnotmatch '\A[0-9.]+\z') {
              throw 'Handle version unavailable'
            }
            $stage = 'ready'
            "QID_SQLITE_HANDLE_EXE=$executable" >> $env:GITHUB_ENV
            Write-Host "Microsoft-signed Handle $version passed exact-path self-test."
          } catch {
            # Stage labels are fixed; never log exception, path, or tool output.
            # Optional tooling must never prevent the original test/delete assertion.
            Write-Host "HANDLE unavailable at stage=$stage (raw output suppressed)."
          }
      - name: Preflight the headless helper without capturing diagnostic output
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $owned = [Collections.Generic.List[string]]::new()
          $child = [Diagnostics.Process]::new()
          $started = $false
          $failed = $false
          try {
            $db = Join-Path ([IO.Path]::GetTempPath()) "qid-cleanup-preflight-$([Guid]::NewGuid().ToString('N')).db"
            foreach ($path in @($db, "$db-wal", "$db-shm", "$db-journal")) {
              # CreateNew never takes ownership of a pre-existing file.
              $file = [IO.File]::Open($path, [IO.FileMode]::CreateNew)
              try { $owned.Add($path) } finally { $file.Dispose() }
            }
            $child.StartInfo.FileName = (Get-Process -Id $PID).Path
            $child.StartInfo.UseShellExecute = $false
            $child.StartInfo.CreateNoWindow = $true
            $child.StartInfo.RedirectStandardOutput = $true
            $child.StartInfo.RedirectStandardError = $true
            foreach ($argument in @('-NoLogo', '-NoProfile', '-NonInteractive', '-File',
                (Join-Path $env:GITHUB_WORKSPACE 'qid-storage/tests/fixtures/windows_sqlite_cleanup.ps1'),
                '-Database', $db, '-Preflight')) {
              $child.StartInfo.ArgumentList.Add($argument)
            }
            $started = $child.Start()
            if (-not $started) { throw 'Helper did not start' }
            # Drain both streams without handlers: no helper or exception text escapes.
            $child.BeginOutputReadLine()
            $child.BeginErrorReadLine()
            if (-not $child.WaitForExit(15000)) { throw 'Helper timed out' }
            if ($child.ExitCode -ne 0) { throw 'Helper failed' }
          } catch {
            Write-Host 'ERROR: Headless helper preflight failed (raw output suppressed).'
            $failed = $true
          } finally {
            try {
              if ($started -and -not $child.HasExited) {
                $child.Kill($true)
                if (-not $child.WaitForExit(15000)) { throw 'Helper did not stop' }
              }
            } catch {
              Write-Host 'ERROR: Preflight cleanup could not stop the helper (raw output suppressed).'
              $failed = $true
            } finally {
              $child.Dispose()
            }
            # Independent removals include only files this step successfully created.
            foreach ($path in $owned) {
              try {
                if (Test-Path -LiteralPath $path) { Remove-Item -LiteralPath $path -Force }
              } catch {
                Write-Host 'ERROR: Preflight cleanup could not remove a temporary file.'
                $failed = $true
              }
            }
          }
          if ($failed) { exit 1 }
          Write-Host 'Headless helper preflight passed (no diagnostic output retained).'
      - name: Run cleanup suites with bounded owner capture
        timeout-minutes: 24
        shell: pwsh
        env:
          QID_SQLITE_CLEANUP_DIAGNOSTIC: "1"
          QID_SQLITE_CLEANUP_DIAGNOSTIC_TIMEOUT_SECONDS: "15"
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $reportName = 'windows-sqlite-cleanup-diagnostic-{0}-{1}.txt' -f $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT
          $report = Join-Path $env:RUNNER_TEMP $reportName
          $reportFile = [IO.File]::Open($report, [IO.FileMode]::CreateNew, [IO.FileAccess]::Write, [IO.FileShare]::None)
          $reportFile.Dispose()
          $script:reportLimit = 65536
          $script:reportEncoding = [Text.UTF8Encoding]::new($false)
          $header = 'Sanitized diagnostic rows only; Restart Manager and Handle snapshots are not exhaustive.' + [Environment]::NewLine
          [IO.File]::WriteAllText($report, $header, $script:reportEncoding)
          $script:reportBytes = [Text.Encoding]::UTF8.GetByteCount($header)
          $script:reportNotice = 'REPORT truncated: sanitized diagnostics exceeded the 65536-byte limit.' + [Environment]::NewLine
          $script:reportNoticeBytes = [Text.Encoding]::UTF8.GetByteCount($script:reportNotice)
          $script:reportTruncated = $false
          $script:report = $report
          $script:reportPattern = '\A(?:RM image=[A-Za-z0-9_.-]+ pid=[0-9]+ suffix=(?:db|-wal|-shm|-journal)|RM suffix=(?:db|-wal|-shm|-journal) holders=none|RM snapshot complete \(not an exhaustive handle trace\)\.|HANDLE pid=[0-9]+ db=test_(?:14|15)\.db exact_file_matches=[0-9]+ \(live snapshot, not exhaustive\)\.|HANDLE unavailable \((?:helper could not be collected|raw output suppressed)\)\.|ERROR: Restart Manager snapshot untrusted \(raw exception suppressed\)\.|ERROR: Windows cleanup diagnostic process tree was not confirmed stopped|ERROR: Windows cleanup diagnostic timed out or could not be collected)\z'
          function Add-SanitizedDiagnosticLines {
            param([object[]]$Lines)
            foreach ($candidate in $Lines) {
              if ($script:reportTruncated) { break }
              $line = [string]$candidate
              if ($line -cnotmatch $script:reportPattern) {
                # libtest can leave its `test … ... ` progress prefix without a
                # newline while a child diagnostic writes to inherited stdout.
                # Recover only an RM, HANDLE or fixed ERROR record whose entire
                # suffix matches the allowlist; never preserve the joined text.
                $record = $null
                foreach ($marker in [regex]::Matches($line, 'RM |HANDLE |ERROR:')) {
                  $recordCandidate = $line.Substring($marker.Index)
                  if ($recordCandidate -cmatch $script:reportPattern) {
                    $record = $recordCandidate
                    break
                  }
                }
                if ($null -eq $record) { continue }
                $line = $record
              }
              $record = $line + [Environment]::NewLine
              $recordBytes = [Text.Encoding]::UTF8.GetByteCount($record)
              if ($script:reportBytes + $recordBytes + $script:reportNoticeBytes -gt $script:reportLimit) {
                [IO.File]::AppendAllText($script:report, $script:reportNotice, $script:reportEncoding)
                $script:reportBytes += $script:reportNoticeBytes
                $script:reportTruncated = $true
                break
              }
              [IO.File]::AppendAllText($script:report, $record, $script:reportEncoding)
              $script:reportBytes += $recordBytes
            }
          }
          # Exercise the same sanitizer and report file that the artifact upload
          # consumes. The joined progress prefix and malformed row must never be
          # persisted; restore the header before collecting real diagnostics.
          $reportBeforeSanitizerTest = [IO.File]::ReadAllBytes($script:report)
          $reportBytesBeforeSanitizerTest = $script:reportBytes
          $reportTruncatedBeforeSanitizerTest = $script:reportTruncated
          $sanitizerTestFailed = $false
          try {
            $safeProbes = @(
              'RM image=sqlx_sqlite.exe pid=1234 suffix=db',
              'HANDLE pid=1234 db=test_14.db exact_file_matches=0 (live snapshot, not exhaustive).',
              'HANDLE unavailable (helper could not be collected).',
              'ERROR: Restart Manager snapshot untrusted (raw exception suppressed).',
              'ERROR: Windows cleanup diagnostic timed out or could not be collected'
            )
            $joinedProbes = @($safeProbes | ForEach-Object {
              'test qid_storage::sql::cleanup ... PRIVATE_PREFIX ' + $_
            })
            $invalidProbe = 'test qid_storage::cleanup ... RM image=../private pid=1234 suffix=db'
            $trailingProbe = 'test qid_storage::cleanup ... ERROR: Restart Manager snapshot untrusted (raw exception suppressed). PRIVATE_SUFFIX'
            Add-SanitizedDiagnosticLines @($joinedProbes + $invalidProbe + $trailingProbe)
            $sanitized = [IO.File]::ReadAllLines($script:report)
            $expectedLines = @('Sanitized diagnostic rows only; Restart Manager and Handle snapshots are not exhaustive.') + $safeProbes
            if ($sanitized.Count -ne $expectedLines.Count) { throw 'Sanitized report row count mismatch' }
            for ($i = 0; $i -lt $expectedLines.Count; $i++) {
              if ($sanitized[$i] -cne $expectedLines[$i]) { throw 'Sanitized report row mismatch' }
            }
            if (($sanitized -join "`n") -match 'PRIVATE_PREFIX|PRIVATE_SUFFIX|\.\./private') {
              throw 'Sanitized report retained joined or malformed text'
            }
          } catch {
            Write-Host 'ERROR: Workflow sanitizer artifact self-test failed (raw output suppressed).'
            $sanitizerTestFailed = $true
          } finally {
            try {
              [IO.File]::WriteAllBytes($script:report, $reportBeforeSanitizerTest)
              $script:reportBytes = $reportBytesBeforeSanitizerTest
              $script:reportTruncated = $reportTruncatedBeforeSanitizerTest
            } catch {
              Write-Host 'ERROR: Workflow sanitizer artifact self-test cleanup failed (raw output suppressed).'
              $sanitizerTestFailed = $true
            }
          }
          if ($sanitizerTestFailed) { exit 1 }
          $suffix = "diagnostic-$([Guid]::NewGuid().ToString('N'))"
          $database = Join-Path ([IO.Path]::GetTempPath()) "qid-user-deletion-$suffix.db"
          $paths = @($database, "$database-wal", "$database-shm", "$database-journal")
          foreach ($path in $paths) {
            if (Test-Path -LiteralPath $path) {
              Write-Host 'ERROR: Diagnostic path collision; no existing file was claimed.'
              exit 1
            }
          }
          # The user-deletion test reads this exact random suffix. Cleanup later
          # removes only this previously absent database and its sidecars.
          "QID_SQLITE_CLEANUP_SUFFIX=$suffix" >> $env:GITHUB_ENV
          "QID_DIAGNOSTIC_OWNED=true" >> $env:GITHUB_ENV
          $env:QID_SQLITE_CLEANUP_SUFFIX = $suffix
          # Both invocations retain Restart Manager capture before unchanged
          # cleanup. Handle adds a PID/full-path filtered snapshot only for
          # test_14.db and test_15.db; neither source is an exhaustive trace.
          Write-Host 'Running focused Windows user-deletion cleanup test (1/2)'
          $userDeletionArguments = @(
            'test', '--locked', '-p', 'qid-storage', '--test', 'user_deletion',
            'sql_user_deletion_cleans_only_owned_authentication_state',
            '--', '--exact', '--nocapture', '--test-threads=1'
          )
          $output = @()
          & cargo @userDeletionArguments 2>&1 | Tee-Object -Variable output
          $failed = $LASTEXITCODE -ne 0
          Add-SanitizedDiagnosticLines $output
          # Match the normal Windows suite's single-threaded qid-storage test
          # order so the IGA cases exercise their original per-test DB sequence.
          Write-Host 'Running single-threaded qid-storage library cleanup suite (2/2)'
          $output = @()
          & cargo test --locked -p qid-storage --lib -- --nocapture --test-threads=1 2>&1 | Tee-Object -Variable output
          $libraryExitCode = $LASTEXITCODE
          Add-SanitizedDiagnosticLines $output
          if ($libraryExitCode -ne 0) { $failed = $true }
          if ($failed) { exit 1 }
      - name: Erase the diagnostic SQLite files
        timeout-minutes: 2
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:QID_DIAGNOSTIC_OWNED -ne 'true') { exit 0 }
          $suffix = $env:QID_SQLITE_CLEANUP_SUFFIX
          if ([string]::IsNullOrEmpty($suffix) -or $suffix -cnotmatch '\A[A-Za-z0-9-]+\z') {
            Write-Host 'ERROR: Diagnostic cleanup key is missing or invalid.'
            exit 1
          }
          $database = Join-Path ([IO.Path]::GetTempPath()) "qid-user-deletion-$suffix.db"
          $failed = $false
          foreach ($path in @($database, "$database-wal", "$database-shm", "$database-journal")) {
            try {
              if (Test-Path -LiteralPath $path) { Remove-Item -LiteralPath $path -Force }
            } catch {
              Write-Host 'ERROR: Diagnostic cleanup could not remove an owned SQLite file.'
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
      - name: Erase the optional Handle download
        timeout-minutes: 2
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $key = $env:QID_SQLITE_HANDLE_KEY
          if ([string]::IsNullOrEmpty($key)) { exit 0 }
          if ($key -cnotmatch '\A[0-9a-f]{32}\z') {
            Write-Host 'ERROR: Handle cleanup key is invalid.'
            exit 1
          }
          try {
            Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP "qid-handle-$key") -Recurse -Force
          } catch {
            Write-Host 'ERROR: Could not remove the owned Handle download (raw output suppressed).'
            exit 1
          }
      - name: Upload sanitized Windows SQLite diagnostic
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-sqlite-cleanup-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/windows-sqlite-cleanup-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Erase sanitized Windows SQLite diagnostic
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $reportName = 'windows-sqlite-cleanup-diagnostic-{0}-{1}.txt' -f $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT
          $report = Join-Path $env:RUNNER_TEMP $reportName
          try {
            if (Test-Path -LiteralPath $report) { Remove-Item -LiteralPath $report -Force }
          } catch {
            Write-Host 'ERROR: Could not erase the owned sanitized diagnostic report.'
            exit 1
          }
