[workspace]
members = [
    "qid-admin",
    "qid-core",
    "qid-crypto",
    "qid-storage",
    "qid-http",
    "qid-session",
    "qid-mfa",
    "qid-oidc",
    "qid-oauth",
    "qid-oauth-token-tests",
    "qid-policy",
    "qid-proxy",
    "qid-observability",
    "qid-diagnostics",
    "qidd",
    "qidc",
    "qid-migrate",
    "qid-resource",
    "qid-saml",
    "qid-scim",
    "qid-directory",
    "qid-sync",
    "qid-network",
    "qid-agent",
    "qid-dev",
    "qid-risk",
    "qid-iga",
    "qid-federation",
    "qid-vc",
    "qid-worker",
    "qid-ops",
    "xtask",
]
resolver = "3"
exclude = ["vendor/rustls"]

# Product-source line limits; test code is reported separately and is not capped.
# Inline #[cfg(test)] modules in mixed source files remain in source counts.
# Headroom covers the configurable CAPPORT/QUIC wiring (server.paths.capport_details,
# server.quic, qid-network listener split, per-realm gating).
# Ratchet: 12 edge-PEP, 41 OAuth, 64 IGA tenant-context, 256 admin error-mapping,
# and 6 OAuth token-audit, 7 DCR-context, 16 OAuth response-mapping, 95 session-cookie,
# 29 session realm-resolution, 29 shared runtime-realm lookup, 45 lowercase-hex utility,
# 17 session-config mapping, 9 session-cookie, 4 shared SHA-256-hex,
# 1 MFA email-token utility, 24 audited-delete response lines, and
# 12 shared JWK kid-selection lines, 52 browser-session context lines, and
# 18 shared CIAM-provider predicate lines.
[workspace.metadata.budget]
# Raised from 103263 to 103500 to accommodate the queued correctness fixes:
# the load-time directory provider checks, the LDAP paging-control check, the
# configuration error messages, the CSV decoder and the object-only body
# guard. Raised again to 103600 for the storage-ownership typed contract
# (OwnershipContract plus the user and CIAM consent grant families) and the
# symmetric duplicate-email update fix. Device registration added 23 source
# lines and FedCM identity added 20: measured use rose from 103550 to 103593,
# leaving 7 lines under that cap. The next service-account slice added 14,
# reaching 103607, so the old cap was insufficient for the staged migrations.
# The 103800 total was a 200-line ceiling, not a target. The realm ownership
# fix adds 18 measured product-source lines; six came from existing headroom,
# so the cap rises by 12 to 103812, exactly the new source count. The typed
# create-only map operation for policy bundles, users and clients, policy SQL
# refusal and repository contract add 51 net product-source lines against that
# baseline (xtask budget: 103812 -> 103863), so the cap rises by exactly 51.
# The stable client-update binding guard and static SQL contract add 69 lines
# (xtask budget: 103863 -> 103932), so the cap rises by exactly 69.
# Workload-certificate revocation validation and its documented trait contract
# add 32 measured product lines (103932 -> 103964), so the cap rises exactly.
# SCIM user create-only conflict safety (typed file identity, static SQL
# conflict mapping and trait contract) adds 37 measured product lines
# (103964 -> 104001), so the cap rises by exactly 37.
total = 104001
default_per_crate = 4000

[workspace.metadata.budget.per_crate]
# Headroom for QUIC bind/serve startup and shutdown code/tests in qid-network.
qid-network = 4500
qid-admin = 6000
qid-core = 14000
qid-crypto = 5600
qid-storage = 13000
qid-oidc = 6000
qid-oauth = 12000
qid-saml = 7200
qid-directory = 4000
qid-federation = 5000
qid-iga = 6300
qid-resource = 5200
qid-scim = 4600
qid-worker = 5200

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["qid contributors"]
repository = "https://github.com/t-koba/qid"
homepage = "https://github.com/t-koba/qid"
documentation = "https://github.com/t-koba/qid/tree/main/docs"
description = "qid identity platform and external decision service workspace"
rust-version = "1.96"

[workspace.dependencies]
anyhow = "1"
argon2 = "0.5"
async-trait = "0.1"
base64 = "0.22"
axum = "0.7"
axum-server = { version = "0.7", features = ["tls-rustls"] }
clap = { version = "4", features = ["derive", "env"] }
figment = { version = "0.10", features = ["env", "toml", "yaml"] }
insta = { version = "1", features = ["json"] }
jsonwebtoken = "9"
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
ed25519-dalek = { version = "2", features = ["pkcs8", "pem"] }
p256 = { version = "0.13", features = ["pem", "ecdsa", "pkcs8"] }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sigstore-tsa = { version = "0.11", default-features = false }
spki = "0.7"
sha1 = "0.10"
aes = "0.8"
aes-gcm = "0.10"
flate2 = "1"
hkdf = "0.12"
chacha20poly1305 = "0.10"
ciborium = "0.2"
rsa = "0.9"
roxmltree = "0.20"
x509-parser = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking"] }
hmac = "0.12"
data-encoding = "2"
hex = "0.4"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "sqlite", "migrate", "any"] }
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
http-body-util = "0.1"
tower-http = { version = "0.5", features = ["cors"] }
tempfile = "3"
ulid = "1"
urlencoding = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
webauthn = { package = "caden", version = "0.7.0", features = ["serde"] }
x25519-dalek = { version = "2", features = ["reusable_secrets", "static_secrets"] }
subtle = "2"
zeroize = { version = "1", features = ["derive"] }
ldap3 = { version = "0.12", default-features = false, features = ["tls-rustls-ring"] }
lru = "0.18.2"
proptest = "1.6"
quinn = "0.11"
rustls = "0.23"
rustls-pemfile = "2"
rustls-pki-types = "1.14"
tokio-rustls = "0.26"
rcgen = { version = "0.13", features = ["x509-parser"] }
time = "0.3"

# qid internal crates
qid-admin = { version = "0.1.0", path = "qid-admin" }
qid-core = { version = "0.1.0", path = "qid-core" }
qid-crypto = { version = "0.1.0", path = "qid-crypto" }
qid-http = { version = "0.1.0", path = "qid-http" }
qid-observability = { version = "0.1.0", path = "qid-observability" }
qid-mfa = { version = "0.1.0", path = "qid-mfa" }
qid-network = { version = "0.1.0", path = "qid-network" }
qid-oauth = { version = "0.1.0", path = "qid-oauth" }
qid-oidc = { version = "0.1.0", path = "qid-oidc" }
