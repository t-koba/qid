profile: oidc

storage:
  primary:
    type: file
    url: "config/usecases/data/runtime/02-application-sign-in/password-policy-lockout.json"

crypto:
  default_alg: ES256
  keyrings:
    - name: retail-sample-token
      realm_id: retail
      purposes: [oidc_token]
      signer:
        type: local
      rotation:
        overlap_days: 14
        max_age_days: 90

server:
  listen: "0.0.0.0:8443"
  public_base_url: "https://id.example.com"

realms:
  - id: retail
    issuer: "https://id.example.com/realms/retail"
    display_name: "Retail Accounts"
    clients:
      - client_id: "retail-web"
        client_type: confidential
        token_endpoint_auth_method: client_secret_basic
        client_secret: "change-me-retail-web-secret"
        redirect_uris:
          - "https://retail.example.com/callback"
        grant_types:
          - authorization_code
          - refresh_token
    authentication:
      passkeys:
        enabled: true
        rp_id: "id.example.com"
        rp_origin: "https://id.example.com"
      password:
        enabled: true
        hash: argon2id
        max_failed_attempts: 5
        lockout_duration_seconds: 900
        max_failed_attempts_per_realm: 200
        # Opt-in establishment/change screening; omit the whole block for no check/network.
        # This local example lists the exact UTF-8 password "password", not a complete list.
        # Login and verified-password rehash are never screened.
        screening:
          sha256_hex:
            - "5e884898da28047151d0e56f8dc6292773603d0d6aabbdd62a11ef721d1542d8"
          # Optional operator-selected HTTPS endpoint; no implicit public service:
          # range_url: https://range.example.com/range/
          on_unavailable: deny # explicit allow permits failures, never positive matches
          timeout_ms: 3000
          max_retries: 0
          retry_delay_ms: 250
          max_response_bytes: 1048576
        argon2id:
          memory_kib: 65536
          time_cost: 3
          parallelism: 2
      mfa:
        totp:
          enabled: true
    policy:
      default_decision: deny
      bundles:
        - name: authenticated-read
          source: "file://../../policies/authenticated-read.json"
          mode: enforce
