profile: vc

storage:
  primary:
    type: file
    url: "config/usecases/data/runtime/08-verifiable-credentials/issuance-revocation-status-list.json"

server:
  listen: "0.0.0.0:8443"
  public_base_url: "https://id.example.com"
  http_message_signatures:
    enabled: true
    shared_secret: "0123456789abcdef0123456789abcdef"
    key_id: "vc-status-2026-06"
    max_age_seconds: 300
    require_content_digest: true

crypto:
  keyrings:
    # Keep OIDC and other deployment tokens on a separate primary key.
    - name: oidc-primary
      purposes:
        - oidc_token
      signer:
        type: local
    - name: credential-status-issuer
      realm_id: credentials
      purposes:
        - other:vc_issuer
      signer:
        type: local

realms:
  - id: credentials
    issuer: "https://id.example.com/realms/credentials"
    display_name: "Credential Issuance and Status"
    clients:
      - client_id: "vc-status-reader"
        client_type: confidential
        token_endpoint_auth_method: private_key_jwt
        jwks:
          keys:
            - kty: EC
              crv: P-256
              kid: "vc-status-reader-signing"
              use: sig
              alg: ES256
              x: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
              y: "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
        grant_types:
          - client_credentials
    protocols:
      vc:
        credential_audience: "api://qid/vc"
        status_audience: "api://qid/vc-status"
        issuer_key_ref: "credential-status-issuer"
      oidc:
        authorization_code:
          enabled: true
          pkce_required: true
          require_signed_request_object: true
      oauth:
        introspection:
          enabled: true
          jwt_response: true
        par:
          enabled: true
        rar:
          enabled: true
        dpop:
          enabled: true
          replay_cache: true
          nonce: true
        mtls:
          enabled: true
        private_key_jwt:
          enabled: true
        jarm:
          enabled: true
        require_pushed_authorization_requests: true
        tokens:
          access_token_format: jwt
          access_token_ttl_seconds: 300
        resource_servers:
          - audience: "api://qid/vc"
            resources:
              - "https://id.example.com/vc/v1"
            scopes:
              - openid
              - qid_identity
              - vc.issue
              - vc.verify
            introspection_client_ids:
              - vc-status-reader
            require_sender_constraint: true
            high_risk: true
          - audience: "api://qid/vc-status"
            resources:
              - "https://id.example.com/vc/v1/status"
            scopes:
              - openid
              - qid_identity
              - vc.issue
              - vc.verify
            introspection_client_ids:
              - vc-status-reader
            require_sender_constraint: true
            high_risk: true
    authentication:
      passkeys:
        enabled: true
        rp_id: "id.example.com"
        rp_origin: "https://id.example.com"
    policy:
      default_decision: deny
      bundles:
        - name: authenticated-read
          source: "file://../../policies/authenticated-read.json"
          mode: enforce
