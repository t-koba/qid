[advisories]
ignore = [
    "RUSTSEC-2025-0134",
    "RUSTSEC-2023-0071",
    # RUSTSEC-2024-0449: unsafe-libyaml 0.2.11 is unmaintained (archived
    # upstream 2024-03-25). It arrives transitively via figment 0.10 "yaml" ->
    # serde_yaml 0.9 (deprecated) and parses only operator-supplied local
    # config files (.yaml/.yml), never remote input; the 64-bit unsoundness
    # advisory RUSTSEC-2023-0075 is patched in 0.2.11. YAML loading is a live
    # product surface, and no maintained YAML parser is available in the
    # offline build environment, so replacement (e.g. a safe-Rust parser for
    # the figment YAML provider) is tracked as follow-up work, not done here.
    "RUSTSEC-2024-0449",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = false
registries = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
deny = []
skip = [
    "windows-targets@0.48.5",
    "windows_aarch64_gnullvm@0.48.5",
    "windows_aarch64_msvc@0.48.5",
    "windows_i686_gnu@0.48.5",
    "windows_i686_msvc@0.48.5",
    "windows_x86_64_gnu@0.48.5",
    "windows_x86_64_gnullvm@0.48.5",
    "windows_x86_64_msvc@0.48.5",
]
skip-tree = []
