[advisories]
ignore = [
    "RUSTSEC-2025-0134",
    "RUSTSEC-2023-0071",
    # RUSTSEC-2026-0543: chrono is flagged "unmaintained" (category INFO,
    # no known vulnerability, no patched release; advisory published
    # 2026-09-14). This is a maintenance notice, not a security defect, and no
    # `cargo update` can clear it because all chrono versions are affected.
    # It reaches qid only transitively: tsp-ltv 0.6.0 (a pinned direct
    # dependency of qid-saml used for SAML long-term validation) and krb5
    # 1.0.0 (a dev-only SPNEGO proof in qid-federation). Time-bounded waiver
    # with a tracked replacement: move off chrono via a tsp-ltv or krb5
    # release that drops it, or migrate date handling to jiff/time. Review
    # this entry and its replacement plan by 2027-02-18 and remove the waiver
    # once the dependency no longer pulls chrono. No vulnerability advisory
    # is waived here; all other advisories remain enforced.
    "RUSTSEC-2026-0543",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = false
registries = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
deny = []
skip = [
    "windows-targets@0.48.5",
    "windows_aarch64_gnullvm@0.48.5",
    "windows_aarch64_msvc@0.48.5",
    "windows_i686_gnu@0.48.5",
    "windows_i686_msvc@0.48.5",
    "windows_x86_64_gnu@0.48.5",
    "windows_x86_64_gnullvm@0.48.5",
    "windows_x86_64_msvc@0.48.5",
]
skip-tree = []
