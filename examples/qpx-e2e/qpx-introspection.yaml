state_dir: "${QPX_STATE_DIR:-./qpx-state}-introspection"
identity:
  proxy_name: qpx-e2e-introspection
security:
  identity_sources:
  - name: bearer-resource-server
    type: bearer
    bearer:
      source:
        mode: introspection
        endpoint: http://127.0.0.1:8443/oauth2/introspect
        client_id: e2e-egress
        client_secret_env: QPX_DECISION_CLIENT_SECRET
        positive_cache_seconds: 60
        negative_cache_seconds: 5
      claims:
        user_from_sub: true
        groups: groups
        tenant: tenant
        auth_strength: acr
        idp: iss
  decisions:
    services:
    - name: external-authzen
      endpoint: http://127.0.0.1:8443/access/v1/evaluation
      timeout_ms: 300
      contract:
        driver: authzen
        profile_id: authzen-evaluation-v1
        schemas: {}
      capability:
        effects:
        - allow
      auth:
        oauth2_client_credentials:
          token_endpoint: http://127.0.0.1:8443/oauth2/token
          client_id: e2e-egress
          client_secret_env: QPX_DECISION_CLIENT_SECRET
          client_auth_method: client_secret_basic
          scope: api
          resource: urn:qid:pep:qpx:edge/e2e-egress
      response_mapping:
      - target_document: enforceable_effect
        target: /external_decision_id
        source: $.decision_response.context.decision_id
      - target_document: enforceable_effect
        target: /policy_id
        source: $.decision_response.context.policy_id
      - target_document: enforceable_effect
        target: /policy_tags
        source: $.decision_response.context.policy_tags
        optional: true
edges:
- kind: forward
  name: e2e-egress-introspection
  listen: 127.0.0.1:18089
  default_action:
    type: block
  rules:
  - name: allow-authenticated
    match:
      host:
      - "*"
      identity:
        user:
        - "*"
    action:
      type: direct
  policy_context:
    identity_sources:
    - bearer-resource-server
    decision_service: external-authzen
