[workspace]

[package]
name = "qid-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
aes-gcm = "0.10"
libfuzzer-sys = "0.4"
qid-crypto = { path = "../qid-crypto" }
qid-core = { path = "../qid-core" }
qid-network = { path = "../qid-network" }
qid-policy = { path = "../qid-policy" }
qid-saml = { path = "../qid-saml" }
qid-scim = { path = "../qid-scim" }
qid-tls = { path = "../qid-tls" }
serde_json = "1"

[[bin]]
name = "jwt"
path = "fuzz_targets/jwt.rs"

[[bin]]
name = "scim_filter"
path = "fuzz_targets/scim_filter.rs"

[[bin]]
name = "saml_xml"
path = "fuzz_targets/saml_xml.rs"

[[bin]]
name = "policy"
path = "fuzz_targets/policy.rs"

[[bin]]
name = "radius"
path = "fuzz_targets/radius.rs"

[[bin]]
name = "tacacs"
path = "fuzz_targets/tacacs.rs"

[[bin]]
name = "eap"
path = "fuzz_targets/eap.rs"

[[bin]]
name = "tls13_record"
path = "fuzz_targets/tls13_record.rs"

[[bin]]
name = "tls12_client_hello"
path = "fuzz_targets/tls12_client_hello.rs"
