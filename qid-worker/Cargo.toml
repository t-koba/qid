[package]
name = "qid-worker"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
rust-version.workspace = true

[[bin]]
name = "qid-worker"
path = "src/main.rs"

[features]
default = []
smtp-transport = ["dep:lettre"]

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
clap = { workspace = true }
qid-core = { workspace = true }
qid-crypto = { workspace = true }
qid-directory = { workspace = true }
qid-observability = { workspace = true }
qid-ops = { workspace = true }
qid-scim = { workspace = true }
qid-storage = { workspace = true }
lettre = { workspace = true, optional = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sigstore-tsa = { workspace = true }
tokio = { workspace = true }
ulid = { workspace = true }
zeroize = { workspace = true }
rustls-pemfile = { workspace = true }
rustls-pki-types = { workspace = true }

[dev-dependencies]
base64 = { workspace = true }
rcgen = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
